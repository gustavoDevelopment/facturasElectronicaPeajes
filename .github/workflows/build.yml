name: Build apps

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt pyinstaller
      - name: Tests
        run: python -m pytest tests -q
      - name: Build
        run: pyinstaller causa_peajes.spec --noconfirm
      - name: Self-check (macOS)
        if: runner.os == 'macOS'
        run: '"dist/Causa Peajes.app/Contents/MacOS/CausaPeajes" --check'
      - name: Self-check (Windows)
        if: runner.os == 'Windows'
        run: dist/CausaPeajes/CausaPeajes.exe --check
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Causa Peajes.app" CausaPeajes-macos.zip
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/CausaPeajes -DestinationPath CausaPeajes-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CausaPeajes-${{ runner.os }}
          path: CausaPeajes-*.zip

  release:
    # Al crear un tag v*, publica los dos zips en la sección Releases del repo
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
