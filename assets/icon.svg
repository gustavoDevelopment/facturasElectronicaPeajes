<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E4A6B"/>
      <stop offset="1" stop-color="#1E88C7"/>
    </linearGradient>
    <clipPath id="arm"><rect x="150" y="238" width="270" height="40" rx="20"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- poste y caseta -->
  <rect x="104" y="226" width="62" height="196" rx="16" fill="#FFFFFF"/>
  <circle cx="135" cy="258" r="12" fill="#0E4A6B"/>
  <!-- brazo de la barrera, levemente levantado -->
  <g transform="rotate(-14 150 258)">
    <rect x="150" y="238" width="270" height="40" rx="20" fill="#FFFFFF"/>
    <g clip-path="url(#arm)" fill="#FFB400">
      <rect x="200" y="230" width="30" height="60"/>
      <rect x="260" y="230" width="30" height="60"/>
      <rect x="320" y="230" width="30" height="60"/>
      <rect x="380" y="230" width="30" height="60"/>
    </g>
  </g>
  <!-- calzada -->
  <rect x="84" y="438" width="344" height="16" rx="8" fill="#FFFFFF" fill-opacity=".38"/>
</svg>
